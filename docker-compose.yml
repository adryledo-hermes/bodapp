name: bodapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: bodapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodapp}
      POSTGRES_DB: ${POSTGRES_DB:-bodapp}
    # Bind only to localhost — the app reaches it over the compose network,
    # so the DB is never exposed to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bodapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bodapp} -d ${POSTGRES_DB:-bodapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: applies prisma/migrations then exits.
  # First boot: `docker compose run --rm migrate`
  # (runs `npx prisma migrate deploy` — idempotent, safe to run repeatedly).
  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      # Point the app/migrate at the compose `postgres` service host.
      # Credentials are interpolated from ${POSTGRES_*} (read from the project
      # .env) so no real secret is hardcoded in this committed file. Defaults
      # keep `docker compose up` working out of the box. Set POSTGRES_PASSWORD
      # (and the matching password in DATABASE_URL) in .env to override.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodapp}:${POSTGRES_PASSWORD:-bodapp}@postgres:5432/${POSTGRES_DB:-bodapp}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx --no-install prisma migrate deploy"]

  app:
    build: .
    # Explicit tag: deploy/deploy.sh snapshots this image id before a rebuild
    # and re-tags it to roll back if the new build fails its health gate.
    image: bodapp-app:latest
    container_name: bodapp-app
    restart: unless-stopped
    # PID 1 init: forwards signals (graceful SIGTERM shutdown) and reaps zombies.
    init: true
    # Graceful restarts: in-flight requests get up to 30s to drain after SIGTERM.
    stop_grace_period: 30s
    env_file: .env
    environment:
      # Postgres host is the compose service name, not localhost.
      # Same ${POSTGRES_*} interpolation as the `migrate` service above.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodapp}:${POSTGRES_PASSWORD:-bodapp}@postgres:5432/${POSTGRES_DB:-bodapp}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback-only publish: the app is reachable ONLY from this host (by
      # the Caddy reverse proxy, a host systemd service) and never from the
      # network. The container listens on 0.0.0.0:3001 internally — required
      # for Docker's port forwarding; this 127.0.0.1 bind IS the security
      # boundary. Do NOT publish 0.0.0.0 or drop the 127.0.0.1 prefix.
      - "127.0.0.1:3001:3001"
    volumes:
      # Photo storage: host dir ./storage → /app/storage (must be writable by
      # the container's non-root user, uid 1001 — see deploy/hetzner-setup.md).
      - ./storage:/app/storage
    healthcheck:
      # Liveness: the app's DB-free /healthz route (busybox wget on alpine).
      # Also probed by deploy.sh's health gate and by Caddy's active
      # reverse_proxy health checks.
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 5 http://127.0.0.1:3001/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s     # generous: cold Next.js start after a swap

volumes:
  bodapp-pgdata:
