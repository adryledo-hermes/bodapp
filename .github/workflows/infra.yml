# ------------------------------------------------------------------
# Bodapp → Hetzner INFRASTRUCTURE (Caddy / HTTPS)
#
# STRICT SEPARATION OF PIPELINES:
#   .github/workflows/deploy.yml  = business logic (app image, migrations,
#                                   the bodapp-app container, .env)
#   .github/workflows/infra.yml   = infrastructure (this file: Caddy,
#                                   /etc/caddy/Caddyfile, certificates,
#                                   end-to-end TLS verification)
# This workflow never builds or restarts the app; deploy.yml never touches
# Caddy. State does not overlap either: this workflow copies its assets to
# /tmp on the server and does NOT touch the /opt/bodapp working tree.
#
# Triggers:
#   - workflow_dispatch ("Run workflow" = explicit infra change)
#   - push to main touching deploy/caddy/** (Caddyfile/template/script)
#
# What it does over SSH:
#   1. runs deploy/caddy/setup-caddy.sh with the CADDY_DOMAIN/CADDY_EMAIL
#      secrets (idempotent: install-if-missing → render template →
#      `caddy validate` → start, or reload only if config changed)
#   2. end-to-end TLS GATE on https://$CADDY_DOMAIN/healthz — ANY HTTP
#      status proves DNS + firewall + certificate + proxy are fine; a 502
#      only means the app container is down, which is deploy.yml's job.
#
# REQUIRED secrets (GitHub environment `prod`) — ready-to-fill catalog:
#   deploy/infra.env.example
#   TAILSCALE_AUTHKEY - ephemeral key: the runner joins our tailnet before
#                       any SSH/scp (the Hetzner firewall accepts SSH only
#                       from the tailnet) and logs out at the end
#   DEPLOY_HOST        - tailnet address of the VPS: MagicDNS name or
#                        100.x IP — NOT the public IP
#   DEPLOY_USER, DEPLOY_SSH_KEY  (same as deploy.yml)
#   CADDY_DOMAIN  - public hostname, e.g. app.example.com
#   CADDY_EMAIL   - ACME/Let's Encrypt contact email
# Optional: DEPLOY_PORT (22).
# NOT read here (business-logic only, see deploy.yml): ENV_FILE, REPO_DIR,
# REPO_URL — infra assets come from the runner checkout via scp.
# ------------------------------------------------------------------
name: Infrastructure — Caddy (HTTPS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/caddy/**

concurrency:
  group: infra-caddy
  cancel-in-progress: false

jobs:
  caddy:
    name: Provision Caddy + TLS gate
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Hetzner firewall accepts SSH only from our tailnet. The runner
      # joins it as a TEMPORARY node with the ephemeral auth key, so the
      # scp + SSH steps below reach DEPLOY_HOST's tailnet address over
      # WireGuard. (Same transport as deploy.yml — keep them in sync.)
      - name: Join tailnet (Tailscale)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "FATAL: TAILSCALE_AUTHKEY secret is not set (Settings -> Environments -> prod)." >&2
            echo "Generate it: Tailscale admin console -> Settings -> Keys -> Generate ephemeral auth key." >&2
            exit 1
          fi
          echo "==> installing Tailscale on the runner"
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "==> starting tailscaled"
          if ! sudo systemctl start tailscaled 2>/dev/null; then
            sudo tailscaled >/tmp/tailscaled.log 2>&1 &
          fi
          okd=0
          for i in $(seq 30); do
            if sudo tailscale status --json >/dev/null 2>&1; then okd=1; break; fi
            sleep 1
          done
          if [ "$okd" != 1 ]; then
            echo "FATAL: tailscaled did not come up" >&2
            cat /tmp/tailscaled.log 2>/dev/null >&2 || true
            exit 1
          fi
          echo "==> joining the tailnet with the ephemeral key"
          sudo tailscale up --auth-key="$TS_AUTHKEY"
          echo "==> runner node: $(hostname) ($(sudo tailscale ip -4 | head -1))"
          echo "==> preflight: TCP ${DEPLOY_PORT} to ${DEPLOY_HOST} over the tailnet"
          if timeout 5 bash -c "exec 3<>/dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT}" 2>/dev/null; then
            echo "    reachable"
          else
            echo "FATAL: cannot reach ${DEPLOY_HOST}:${DEPLOY_PORT} over the tailnet." >&2
            echo "Check: server joined to the tailnet; DEPLOY_HOST = MagicDNS name or 100.x IP;" >&2
            echo "       'sudo tailscale set --ssh' (or sshd) on the server; tailnet ACLs; firewall." >&2
            sudo tailscale status >&2 || true
            exit 1
          fi

      # Assets come from the RUNNER checkout and land in /tmp on the server:
      # the infra pipeline never runs git or writes inside /opt/bodapp, so it
      # cannot race with the business-logic pipeline's checkout.
      - name: Copy Caddy assets to the server
        uses: appleboy/scp-action@v0.3.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/caddy/*"
          target: "/tmp/bodapp-caddy"
          overwrite: true

      - name: Provision Caddy and verify TLS
        uses: appleboy/ssh-action@v1.2.0
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: CADDY_DOMAIN,CADDY_EMAIL
          script: |
            set -euo pipefail

            if [ -z "$CADDY_DOMAIN" ] || [ -z "$CADDY_EMAIL" ]; then
              echo "FATAL: CADDY_DOMAIN and CADDY_EMAIL secrets are required by the infrastructure pipeline." >&2
              exit 1
            fi

            SETUP="$(find /tmp/bodapp-caddy -name setup-caddy.sh 2>/dev/null | head -1)"
            if [ -z "$SETUP" ]; then
              echo "FATAL: setup-caddy.sh not found under /tmp/bodapp-caddy" >&2
              exit 1
            fi
            chmod +x "$SETUP"

            echo "==> provisioning Caddy for $CADDY_DOMAIN"
            CADDY_DOMAIN="$CADDY_DOMAIN" CADDY_EMAIL="$CADDY_EMAIL" bash "$SETUP"

            echo "==> end-to-end TLS gate (first run includes certificate issuance)..."
            tls=0
            for i in $(seq 1 36); do
              # NOTE: no -f on purpose — any HTTP status proves TLS/proxy work;
              # only DNS/firewall/certificate/connection failures keep retrying.
              if curl -sS --max-time 10 -o /dev/null "https://$CADDY_DOMAIN/healthz"; then
                echo "==> TLS OK (try $i)"
                tls=1
                break
              fi
              sleep 5
            done
            if [ "$tls" != 1 ]; then
              echo "FATAL: https://$CADDY_DOMAIN unreachable after ~3min." >&2
              echo "Check: DNS A record, firewall 80/443 (deploy/hetzner-firewall.md)," >&2
              echo "       systemctl status caddy && journalctl -u caddy -n 50" >&2
              exit 1
            fi

            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CADDY_DOMAIN/healthz" || echo 000)"
            case "$code" in
              2*) echo "==> INFRA OK — HTTPS healthy end-to-end (app: $code)" ;;
              5*) echo "==> INFRA OK — TLS/proxy verified; app returned $code (business logic: run the Deploy workflow)" ;;
              *)  echo "==> INFRA OK — TLS verified; app status $code" ;;
            esac

      # Ephemeral node: log the runner out so its tailnet record disappears
      # now instead of lingering until offline expiry. Runs even on failure.
      - name: Leave tailnet
        if: always()
        run: sudo tailscale logout >/dev/null 2>&1 || true
