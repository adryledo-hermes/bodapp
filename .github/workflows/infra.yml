# ------------------------------------------------------------------
# Bodapp → Hetzner INFRASTRUCTURE (Caddy / HTTPS)
#
# STRICT SEPARATION OF PIPELINES:
#   .github/workflows/deploy.yml  = business logic (app image, migrations,
#                                   the bodapp-app container, .env)
#   .github/workflows/infra.yml   = infrastructure (this file: Caddy,
#                                   /etc/caddy/Caddyfile, certificates,
#                                   end-to-end TLS verification)
# This workflow never builds or restarts the app; deploy.yml never touches
# Caddy. State does not overlap either: this workflow copies its assets to
# /tmp on the server and does NOT touch the /opt/bodapp working tree.
#
# Triggers:
#   - workflow_dispatch ("Run workflow" = explicit infra change)
#   - push to main touching deploy/caddy/** (Caddyfile/template/script)
#
# What it does over SSH:
#   1. runs deploy/caddy/setup-caddy.sh with the CADDY_DOMAIN/CADDY_EMAIL
#      secrets (idempotent: install-if-missing → render template →
#      `caddy validate` → start, or reload only if config changed)
#   2. end-to-end TLS GATE on https://$CADDY_DOMAIN/healthz — ANY HTTP
#      status proves DNS + firewall + certificate + proxy are fine; a 502
#      only means the app container is down, which is deploy.yml's job.
#   3. runs deploy/dozzle/setup-dozzle.sh — a live log viewer showing ONLY the
#      bodapp-app container (DOZZLE_FILTER=name=bodapp-app), MCP endpoint at
#      /api/mcp (read-only tools), actions/shell disabled, bound to loopback
#      and published TAILNET-ONLY via `tailscale serve --https=8443` (no
#      funnel: nothing on the public internet; Caddy keeps :80/:443, which is
#      why serve uses 8443). Reuses the Tailscale/SSH secrets above — Dozzle
#      needs NO new secrets.
#   4. runs deploy/monitoring/setup-postgres-monitoring.sh — prepares the
#      database for monitoring (read-only monitor role + self-tests +
#      pg_stat_statements). The ONLY step in the repo allowed to restart
#      postgres does so exclusively when the workflow input
#      `enable_pg_stat_statements` is ticked — that checkbox IS the approval;
#      default = zero database changes (it prints the plan and continues).
#   5. runs deploy/monitoring/setup-monitoring.sh — vmagent + postgres/node/
#      cAdvisor exporters as the separate compose project `bodapp-monitoring`
#      (/opt/bodapp-monitoring), remote_write to Grafana Cloud, every port
#      loopback-only, hard health gates (targets up, no remote-write auth
#      errors, no public binds). Monitoring problems can never fail the app:
#      nothing here touches the /opt/bodapp tree, the app container, Caddy's
#      config or the database container (beyond the input-gated restart).
#
# REQUIRED secrets (GitHub environment `prod`) — ready-to-fill catalog:
#   deploy/infra.env.example
#   TAILSCALE_AUTHKEY - ephemeral key: the runner joins our tailnet before
#                       any SSH/scp (the Hetzner firewall accepts SSH only
#                       from the tailnet) and logs out at the end
#   DEPLOY_HOST        - tailnet address of the VPS: MagicDNS name or
#                        100.x IP — NOT the public IP
#   DEPLOY_USER, DEPLOY_SSH_KEY  (same as deploy.yml)
#   CADDY_DOMAIN  - public hostname, e.g. app.example.com
#   CADDY_EMAIL   - ACME/Let's Encrypt contact email
#   GRAFANA_PROM_URL   - Grafana Cloud remote-write endpoint (…/api/prom/push)
#   GRAFANA_PROM_USER  - numeric Grafana Cloud instance id
#   GRAFANA_PROM_PASSWORD - write token (scope metrics:write, shown once)
#                       (monitoring; details in deploy/infra.env.example)
# Optional: DEPLOY_PORT (22).
# Workflow input (Run workflow → enable_pg_stat_statements, default off):
#   approves the short postgres restart required for query statistics.
# NOT read here (business-logic only, see deploy.yml): ENV_FILE, REPO_DIR,
# REPO_URL — infra assets come from the runner checkout via scp.
# ------------------------------------------------------------------
name: Infrastructure (Caddy HTTPS + Dozzle logs + Grafana monitoring)

on:
  workflow_dispatch:
    inputs:
      enable_pg_stat_statements:
        description: >-
          Enable pg_stat_statements monitoring. Requires a short postgres
          container restart (~5s DB blip; the app reconnects automatically
          and /healthz is DB-free). OFF = no database changes are made.
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - deploy/caddy/**
      - deploy/dozzle/**
      - deploy/monitoring/**

concurrency:
  group: infra-caddy
  cancel-in-progress: false

jobs:
  caddy:
    name: Provision Caddy, TLS gate + Dozzle logs
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Hetzner firewall accepts SSH only from our tailnet. The runner
      # joins it as a TEMPORARY node with the ephemeral auth key, resolves
      # DEPLOY_HOST to its tailnet IP, preflights TCP, and exposes the IP
      # as step output `ts.ts_ip` — the scp + ssh steps below target that IP
      # with plain HOST scp/ssh (deliberately not appleboy/*-action: their
      # containers have no reliable tailnet route/DNS and hang in
      # entrypoint.sh; scp-action@v0.3.0 also simply does not exist).
      - name: Join tailnet (Tailscale)
        id: ts
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "FATAL: TAILSCALE_AUTHKEY secret is not set (Settings -> Environments -> prod)." >&2
            echo "Generate it: Tailscale admin console -> Settings -> Keys -> Generate ephemeral auth key." >&2
            exit 1
          fi
          echo "==> installing Tailscale on the runner"
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "==> starting tailscaled"
          if ! sudo systemctl start tailscaled 2>/dev/null; then
            sudo tailscaled >/tmp/tailscaled.log 2>&1 &
          fi
          okd=0
          for i in $(seq 30); do
            if sudo tailscale status --json >/dev/null 2>&1; then okd=1; break; fi
            sleep 1
          done
          if [ "$okd" != 1 ]; then
            echo "FATAL: tailscaled did not come up" >&2
            cat /tmp/tailscaled.log 2>/dev/null >&2 || true
            exit 1
          fi
          echo "==> joining the tailnet with the ephemeral key"
          sudo tailscale up --auth-key="$TS_AUTHKEY"
          echo "==> runner node: $(hostname) ($(sudo tailscale ip -4 | head -1))"

          ADDR="$DEPLOY_HOST"
          if printf '%s' "$ADDR" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "==> target $ADDR (DEPLOY_HOST is already an IP)"
          else
            echo "==> resolving $DEPLOY_HOST via the tailnet"
            ADDR="$(sudo tailscale status --json | python3 -c '
          import json, os, sys
          host = os.environ["DEPLOY_HOST"].strip().lower().rstrip(".")
          short = host.split(".")[0]
          for p in (json.load(sys.stdin).get("Peer") or {}).values():
              dns = (p.get("DNSName") or "").strip().lower().rstrip(".")
              if host in (dns, (p.get("HostName") or "").strip().lower()) or dns.split(".")[0] == short:
                  ips = p.get("TailscaleIPs") or []
                  if ips:
                      print(ips[0]); break
          ' || true)"
            if [ -z "$ADDR" ]; then
              ADDR="$(getent ahostsv4 "$DEPLOY_HOST" 2>/dev/null | awk '{print $1; exit}')" || true
            fi
            if [ -z "$ADDR" ]; then
              echo "FATAL: cannot resolve $DEPLOY_HOST on the tailnet (wrong name, or the server is not a tailnet node?)" >&2
              sudo tailscale status >&2 || true
              exit 1
            fi
            echo "==> $DEPLOY_HOST -> $ADDR"
          fi

          echo "==> preflight: TCP ${DEPLOY_PORT} to ${ADDR} over the tailnet"
          if timeout 5 bash -c "exec 3<>/dev/tcp/${ADDR}/${DEPLOY_PORT}" 2>/dev/null; then
            echo "    reachable"
          else
            echo "FATAL: cannot reach ${ADDR}:${DEPLOY_PORT} over the tailnet." >&2
            echo "Check: server joined to the tailnet; DEPLOY_HOST = MagicDNS name or 100.x IP;" >&2
            echo "       'sudo tailscale set --ssh' (or sshd) on the server; tailnet ACLs; firewall." >&2
            sudo tailscale status >&2 || true
            exit 1
          fi

          # Full SSH auth probe: catches Tailscale-SSH "additional check"
          # (interactive ACL check — CI can never complete it) and key
          # problems HERE, with the fix printed, instead of a cryptic
          # timeout mid-deploy. ServerAlive 5x3 bounds the check-wait.
          echo "==> SSH auth probe over the tailnet"
          RC=0
          PKEY=()
          PK=""
          if [ -n "$DEPLOY_KEY" ]; then
            PK="$(mktemp)"
            chmod 600 "$PK"
            printf '%s\n' "$DEPLOY_KEY" > "$PK"
            PKEY=(-i "$PK")
          fi
          OUT="$(ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${PKEY[@]}" "$DEPLOY_USER@$ADDR" true 2>&1)" || RC=$?
          if [ -n "$PK" ]; then rm -f "$PK"; fi
          if [ "$RC" = 0 ]; then
            echo "    SSH auth OK as $DEPLOY_USER@$ADDR"
          else
            printf '%s\n' "$OUT" >&2
            if printf '%s' "$OUT" | grep -qi 'additional check'; then
              echo "FATAL: Tailscale SSH demands an INTERACTIVE check for this runner node — CI can never complete it." >&2
              echo "Fix (admin console -> Access controls -> ssh): put an ACCEPT rule ABOVE your check rule, e.g." >&2
              echo '  {"action":"accept","src":["autogroup:member"],"dst":["autogroup:self"],"users":["root","autogroup:nonroot","*"]}' >&2
              echo "  (dst = the server's tag if it is tagged; users must include $DEPLOY_USER; tag the ephemeral key tag:ci to tighten src.)" >&2
            elif printf '%s' "$OUT" | grep -qi 'permission denied'; then
              echo "FATAL: server rejected the key for $DEPLOY_USER — authorized_keys (sshd mode) or the Tailscale SSH 'users' list (tailscale-ssh mode)." >&2
            else
              echo "FATAL: SSH probe failed (rc=$RC)." >&2
            fi
            exit 1
          fi
          echo "ts_ip=$ADDR" >> "$GITHUB_OUTPUT"

      # Assets come from the RUNNER checkout and land in /tmp on the server:
      # the infra pipeline never runs git or writes inside /opt/bodapp, so it
      # cannot race with the business-logic pipeline's checkout.
      # Plain HOST scp — not appleboy/scp-action: its container has no
      # reliable tailnet route/DNS (and v0.3.0 was never a real tag).
      - name: Copy Caddy assets to the server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          umask 077
          KEYF="$(mktemp)"; trap 'rm -f "$KEYF"' EXIT
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          TARGET="$DEPLOY_USER@$TS_IP"
          ssh -p "$DEPLOY_PORT" "${SSH_OPTS[@]}" "$TARGET" \
            'rm -rf /tmp/bodapp-caddy && mkdir -p /tmp/bodapp-caddy'
          scp -P "$DEPLOY_PORT" "${SSH_OPTS[@]}" -r deploy/caddy/* "$TARGET:/tmp/bodapp-caddy/"
          echo "==> assets copied to /tmp/bodapp-caddy on $TS_IP"

      - name: Provision Caddy and verify TLS
        env:
          CADDY_DOMAIN: ${{ vars.CADDY_DOMAIN }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
            # Plain HOST ssh — see the Join tailnet step: the host is a
            # tailnet node; appleboy containers are not reliable there
            # (entrypoint.sh hang). StrictHostKeyChecking=no is deliberate:
            # the peer is WireGuard-verified by the tailnet; runner keys are
            # ephemeral. ConnectTimeout + ServerAlive bound every phase.
            set -euo pipefail
            [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
            umask 077
            KEYF="$(mktemp)"; SCRIPTF="$(mktemp)"
            trap 'rm -f "$KEYF" "$SCRIPTF"' EXIT
            SSH_OPTS=(-p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
            if [ -n "$DEPLOY_KEY" ]; then
              printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
              SSH_OPTS+=(-i "$KEYF")
            fi
            {
              printf 'export CADDY_DOMAIN=%q\n' "$CADDY_DOMAIN"
              printf 'export CADDY_EMAIL=%q\n' "$CADDY_EMAIL"
              cat <<'REMOTE_SCRIPT'
            set -euo pipefail

            if [ -z "$CADDY_DOMAIN" ] || [ -z "$CADDY_EMAIL" ]; then
              echo "FATAL: CADDY_DOMAIN and CADDY_EMAIL secrets are required by the infrastructure pipeline." >&2
              exit 1
            fi

            SETUP="$(find /tmp/bodapp-caddy -name setup-caddy.sh 2>/dev/null | head -1)"
            if [ -z "$SETUP" ]; then
              echo "FATAL: setup-caddy.sh not found under /tmp/bodapp-caddy" >&2
              exit 1
            fi
            chmod +x "$SETUP"

            echo "==> provisioning Caddy for $CADDY_DOMAIN"
            CADDY_DOMAIN="$CADDY_DOMAIN" CADDY_EMAIL="$CADDY_EMAIL" bash "$SETUP"

            echo "==> end-to-end TLS gate (first run includes certificate issuance)..."
            tls=0
            for i in $(seq 1 36); do
              # NOTE: no -f on purpose — any HTTP status proves TLS/proxy work;
              # only DNS/firewall/certificate/connection failures keep retrying.
              if curl -sS --max-time 10 -o /dev/null "https://$CADDY_DOMAIN/healthz"; then
                echo "==> TLS OK (try $i)"
                tls=1
                break
              fi
              sleep 5
            done
            if [ "$tls" != 1 ]; then
              echo "FATAL: https://$CADDY_DOMAIN unreachable after ~3min." >&2
              echo "Check: DNS A record, firewall 80/443 (deploy/hetzner-firewall.md)," >&2
              echo "       systemctl status caddy && journalctl -u caddy -n 50" >&2
              exit 1
            fi

            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$CADDY_DOMAIN/healthz" || echo 000)"
            case "$code" in
              2*) echo "==> INFRA OK — HTTPS healthy end-to-end (app: $code)" ;;
              5*) echo "==> INFRA OK — TLS/proxy verified; app returned $code (business logic: run the Deploy workflow)" ;;
              *)  echo "==> INFRA OK — TLS verified; app status $code" ;;
            esac
            REMOTE_SCRIPT
            } > "$SCRIPTF"
            ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$TS_IP" bash -s < "$SCRIPTF"

      # Dozzle (live log viewer) is infrastructure too: assets come from the
      # runner checkout into /tmp — the same pattern as the Caddy assets — and
      # only Dozzle's OWN container is created. The app container, Caddy and
      # the database are never touched here (deploy.yml owns the app).
      - name: Copy Dozzle assets to the server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          umask 077
          KEYF="$(mktemp)"; trap 'rm -f "$KEYF"' EXIT
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          TARGET="$DEPLOY_USER@$TS_IP"
          ssh -p "$DEPLOY_PORT" "${SSH_OPTS[@]}" "$TARGET" \
            'rm -rf /tmp/bodapp-dozzle && mkdir -p /tmp/bodapp-dozzle'
          scp -P "$DEPLOY_PORT" "${SSH_OPTS[@]}" -r deploy/dozzle/* "$TARGET:/tmp/bodapp-dozzle/"
          echo "==> assets copied to /tmp/bodapp-dozzle on $TS_IP"

      - name: Provision Dozzle and expose it through Tailscale
        env:
          APP_CONTAINER: ${{ vars.DOZZLE_APP_CONTAINER || 'bodapp-app' }}
          DOZZLE_SERVE_PORT: ${{ vars.DOZZLE_SERVE_PORT || '8443' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          umask 077
          KEYF="$(mktemp)"; SCRIPTF="$(mktemp)"
          trap 'rm -f "$KEYF" "$SCRIPTF"' EXIT
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          {
            printf 'export APP_CONTAINER=%q\n' "$APP_CONTAINER"
            printf 'export DOZZLE_SERVE_PORT=%q\n' "$DOZZLE_SERVE_PORT"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          SETUP="$(find /tmp/bodapp-dozzle -name setup-dozzle.sh 2>/dev/null | head -1)"
          if [ -z "$SETUP" ]; then
            echo "FATAL: setup-dozzle.sh not found under /tmp/bodapp-dozzle" >&2
            exit 1
          fi
          chmod +x "$SETUP"
          bash "$SETUP"
          REMOTE_SCRIPT
          } > "$SCRIPTF"
          ssh -p "$DEPLOY_PORT" "${SSH_OPTS[@]}" "$DEPLOY_USER@$TS_IP" bash -s < "$SCRIPTF"

          # End-to-end probe from the RUNNER, which is on the tailnet too:
          # proves the Tailscale serve endpoint answers over TLS. `-k` only
          # skips certificate NAME verification (the tailnet CA is not in the
          # runner's trust store) — the transport is WireGuard either way, and
          # this URL is not reachable from outside the tailnet.
          echo "==> probing https://${DEPLOY_HOST}:${DOZZLE_SERVE_PORT}/healthcheck from the tailnet"
          if curl -kfsS --max-time 15 "https://${DEPLOY_HOST}:${DOZZLE_SERVE_PORT}/healthcheck" >/dev/null; then
            echo "==> DOZZLE OK — https://${DEPLOY_HOST}:${DOZZLE_SERVE_PORT}/ reachable over the tailnet (MCP at /api/mcp)"
          else
            echo "FATAL: Dozzle is not reachable through Tailscale on port ${DOZZLE_SERVE_PORT}." >&2
            echo "  Check: tailnet ACL allows HTTPS; 'tailscale serve status' on the host;" >&2
            echo "        'docker logs dozzle' on the host." >&2
            exit 1
          fi

      # Monitoring (vmagent → Grafana Cloud) follows the same asset flow as
      # Caddy/Dozzle: runner checkout → /tmp on the server → setup script.
      # Only the separate `bodapp-monitoring` compose project is created; the
      # /opt/bodapp tree, the app container, Caddy config and the database
      # container are never touched — the single exception is the input-gated
      # postgres restart in the preparation step below.
      - name: Copy monitoring assets to the server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          umask 077
          KEYF="$(mktemp)"; trap 'rm -f "$KEYF"' EXIT
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          TARGET="$DEPLOY_USER@$TS_IP"
          ssh -p "$DEPLOY_PORT" "${SSH_OPTS[@]}" "$TARGET" \
            'rm -rf /tmp/bodapp-monitoring && mkdir -p /tmp/bodapp-monitoring'
          scp -P "$DEPLOY_PORT" "${SSH_OPTS[@]}" -r deploy/monitoring/* "$TARGET:/tmp/bodapp-monitoring/"
          echo "==> monitoring assets copied to /tmp/bodapp-monitoring on $TS_IP"

      - name: PostgreSQL monitoring preparation (restart gated by input)
        env:
          # Tick the workflow input = approve the short postgres restart;
          # push-triggered runs and unticked dispatches always get '0'.
          MON_ALLOW_RESTART: ${{ inputs.enable_pg_stat_statements && '1' || '0' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          umask 077
          KEYF="$(mktemp)"; SCRIPTF="$(mktemp)"
          trap 'rm -f "$KEYF" "$SCRIPTF"' EXIT
          SSH_OPTS=(-p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          {
            printf 'export MON_ALLOW_RESTART=%q\n' "$MON_ALLOW_RESTART"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          SCRIPT=/tmp/bodapp-monitoring/setup-postgres-monitoring.sh
          [ -f "$SCRIPT" ] || { echo "FATAL: setup-postgres-monitoring.sh not found under /tmp/bodapp-monitoring" >&2; exit 1; }
          chmod +x "$SCRIPT"
          if [ "$MON_ALLOW_RESTART" = "1" ]; then
            echo "==> pg_stat_statements: restart APPROVED via workflow input"
          else
            echo "==> pg_stat_statements: no restart approved — database will not be modified"
          fi
          bash "$SCRIPT"
          REMOTE_SCRIPT
          } > "$SCRIPTF"
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$TS_IP" bash -s < "$SCRIPTF"

      - name: Provision monitoring (vmagent → Grafana Cloud) and verify
        env:
          GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ secrets.GRAFANA_PROM_USER }}
          GRAFANA_PROM_PASSWORD: ${{ secrets.GRAFANA_PROM_PASSWORD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          TS_IP: ${{ steps.ts.outputs.ts_ip }}
        run: |
          set -euo pipefail
          [ -n "${TS_IP:-}" ] || { echo "FATAL: no tailnet IP from the join step" >&2; exit 1; }
          if [ -z "${GRAFANA_PROM_URL:-}" ] || [ -z "${GRAFANA_PROM_USER:-}" ] || [ -z "${GRAFANA_PROM_PASSWORD:-}" ]; then
            echo "FATAL: GRAFANA_PROM_URL / GRAFANA_PROM_USER / GRAFANA_PROM_PASSWORD secrets are required." >&2
            echo "  Add them: GitHub → Settings → Environments → prod (catalog: deploy/infra.env.example)." >&2
            exit 1
          fi
          umask 077
          KEYF="$(mktemp)"; SCRIPTF="$(mktemp)"
          trap 'rm -f "$KEYF" "$SCRIPTF"' EXIT
          SSH_OPTS=(-p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > "$KEYF"
            SSH_OPTS+=(-i "$KEYF")
          fi
          {
            printf 'export GF_PROM_URL=%q\n' "$GRAFANA_PROM_URL"
            printf 'export GF_PROM_USER=%q\n' "$GRAFANA_PROM_USER"
            printf 'export GF_PROM_PASSWORD=%q\n' "$GRAFANA_PROM_PASSWORD"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          SETUP=/tmp/bodapp-monitoring/setup-monitoring.sh
          [ -f "$SETUP" ] || { echo "FATAL: setup-monitoring.sh not found under /tmp/bodapp-monitoring" >&2; exit 1; }
          chmod +x "$SETUP"
          bash "$SETUP"

          # The app must be exactly as before this step: running, loopback-only.
          echo "==> verifying the application is untouched"
          if docker ps -a --format '{{.Names}}' | grep -qx bodapp-app; then
            running="$(docker inspect -f '{{.State.Running}}' bodapp-app)"
            port="$(docker port bodapp-app 3001 2>/dev/null | head -1 || true)"
            echo "    bodapp-app running=$running port=${port:-<none>}"
            [ "$running" = "true" ] || { echo "FATAL: app container is not running" >&2; exit 1; }
            case "$port" in
              127.0.0.1:3001|127.0.0.1:3001*) ;;
              *) echo "FATAL: app port changed during monitoring deploy: '$port' (expected 127.0.0.1:3001)" >&2; exit 1 ;;
            esac
          else
            echo "    bodapp-app not present on this host yet — app stack is deployed separately; no impact either way"
          fi
          echo "==> MONITORING OK — containers healthy, targets up, loopback-only, no remote_write errors"
          REMOTE_SCRIPT
          } > "$SCRIPTF"
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$TS_IP" bash -s < "$SCRIPTF"

      # Ephemeral node: log the runner out so its tailnet record disappears
      # now instead of lingering until offline expiry. Runs even on failure.
      - name: Leave tailnet
        if: always()
        run: sudo tailscale logout >/dev/null 2>&1 || true
